name: Build c64

on:
  pull_request:
    paths:
      - Dockerfile
  push:
    branches:
      - "**"
    paths:
      - Dockerfile
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-dockerfile:
    name: Check Dockerfile
    if: github.event_name == 'pull_request' || github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Run Dockerfile build checks
        run: docker buildx build --check --progress=plain .

  package:
    name: Build distribution
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the distribution image
        run: docker buildx build --load --tag c64:ci .
      - name: Export and verify the distribution
        run: |
          docker run --rm c64:ci > c64.zip
          unzip -t c64.zip
          sha256sum c64.zip > c64.zip.sha256
      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: c64-${{ github.sha }}
          path: |
            c64.zip
            c64.zip.sha256
          if-no-files-found: error
      - name: Publish release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            c64.zip
            c64.zip.sha256
