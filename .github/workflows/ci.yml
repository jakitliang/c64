name: Build c64

on:
  pull_request:
    paths:
      - Dockerfile
      - src/**
      - .github/workflows/ci.yml
  push:
    branches:
      - "**"
    paths:
      - Dockerfile
      - src/**
      - .github/workflows/ci.yml
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-dockerfile:
    name: Check Dockerfile
    if: github.event_name == 'pull_request' || github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Run Dockerfile build checks
        run: docker buildx build --check --progress=plain .

  package:
    name: Build ${{ matrix.name }} distribution
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: c64
            archive: c64.zip
            patch: ''
            llvm_archive: ''
          - name: c64-i686
            archive: c64-i686.zip
            patch: src/variant-i686.patch
            llvm_archive: ''
          - name: c64-clang64
            archive: c64-clang64.zip
            patch: src/variant-clang64.patch
            llvm_archive: llvm-project-19.1.7.tar.gz
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Download LLVM source archive
        if: matrix.llvm_archive != ''
        run: |
          curl --fail --location --retry 3 \
            --output vendor/${{ matrix.llvm_archive }} \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/${{ matrix.llvm_archive }}
          (cd vendor && sha256sum -c ../src/SHA256SUMS.llvm)
      - name: Apply distribution variant
        if: matrix.patch != ''
        run: patch --binary --dry-run -p1 -i ${{ matrix.patch }} && patch --binary -p1 -i ${{ matrix.patch }}
      - name: Build the distribution image
        run: docker buildx build --load --tag c64:ci .
      - name: Export and verify the distribution
        run: |
          docker run --rm c64:ci > ${{ matrix.archive }}
          unzip -t ${{ matrix.archive }}
          sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ github.sha }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error
      - name: Publish release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
